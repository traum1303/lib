services:

  backend:
    build: ./lib/docker
    container_name: lib_backend
    volumes:
      - ./lib:/var/www
      - ./fpm:/usr/local/etc/php/conf.d
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: lib_nginx
    working_dir: /var/www
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./lib:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: lib_db
    restart: always
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: lib
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge